<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>蔵書登録</title>

  <!-- ZXing ライブラリ -->
  <script src="https://unpkg.com/@zxing/library@0.20.0"></script>

  <style>
    body {
      font-family: sans-serif;
      padding: 10px;
    }
    video {
      border: 1px solid #ccc;
    }
    input, button {
      font-size: 16px;
      padding: 6px;
      margin-top: 8px;
      width: 100%;
    }
  </style>
</head>

<body>
  <h2>📚 蔵書登録</h2>

  <!-- ★ 必須：ユーザー操作用ボタン -->
  <button id="start">📷 スキャン開始</button>

  <br><br>

  <video id="video" width="300"></video>

	<hr>

	<h3>ISBN-10 手入力</h3>

	<input id="isbn10Input"
  	     placeholder="例：4-7741-9815-6" />

	<button id="isbn10Button">
  	ISBN-10 で取得
	</button>	

  <p id="isbn">ISBN: </p>
  <p id="title">タイトル: </p>

	<img id="cover"
   src=""
   alt="表紙"
   style="max-width:150px; display:none; margin-top:10px;">

  <input id="location" placeholder="本棚Blue" />

  <button id="save">💾 保存</button>

  <script>
    // =========================
    // 共通データ
    // =========================
    let currentData = {};
    let codeReader = null;

    // =========================
    // ISBN 正規化
    // =========================
    function normalizeISBN(text) {
      return text.replace(/[^0-9X]/gi, "").trim();
    }


document.getElementById("isbn10Button").onclick = () => {
  const input = document.getElementById("isbn10Input").value;

  // ISBN-10 → ISBN-13 に変換
  const isbn13 = isbn10to13(input);

  if (!isbn13) {
    alert("正しい ISBN-10 を入力してください");
    return;
  }

  // 確認表示（任意）
  document.getElementById("isbn").textContent =
    "ISBN: " + isbn13;

  // 既存の取得処理へ
  fetchBook(isbn13);
};



    // =========================
		// ISBN-10 → ISBN-13 変換関数
    // =========================

		function isbn10to13(isbn10) {
  		// 数字とX以外を除去
  		const clean = isbn10.replace(/[^0-9X]/gi, "");

  		// ISBN-10でなければ null
  		if (clean.length !== 10) return null;

  		// 先頭9桁
  		const core = clean.substring(0, 9);

  		// 978を付ける
  		const base = "978" + core;

  		// チェックディジット計算
  		let sum = 0;
  		for (let i = 0; i < 12; i++) {
    		const n = parseInt(base[i], 10);
    		sum += (i % 2 === 0) ? n : n * 3;
  		}

  		const check = (10 - (sum % 10)) % 10;

  		return base + check;
		}

    // =========================
		// 正規化関数
    // =========================

		function normalizeToISBN13(text) {
  		const clean = text.replace(/[^0-9X]/gi, "");

  		// ISBN-13
  		if (clean.length === 13 && (clean.startsWith("978") || clean.startsWith("979"))) {
    		return clean;
  		}

  		// ISBN-10
  		if (clean.length === 10) {
    		return isbn10to13(clean);
  		}

  		// それ以外（雑誌など）
  		return null;
		}


    // =========================
    // OpenBD → Google Books
    // =========================
  function fetchBook(isbn) {
    fetchFromOpenBD(isbn)
      .then(data => {
        if (data) {
          useBookData(data, "OpenBD");
          return "DONE";   // ✅ ここが超重要
        }
        return fetchFromGoogleBooks(isbn);
      })
      .then(data => {
        if (data === "DONE") {
          return;          // ✅ 既にOpenBDで完了
        }
        if (data) {
          useBookData(data, "Google Books");
        } else {
          fallbackManual(isbn);
        }
      })
      .catch(err => {
        console.error(err);
        fallbackManual(isbn);
      });
  }

    function fetchFromOpenBD(isbn) {
      return fetch(`https://api.openbd.jp/v1/get?isbn=${isbn}`)
        .then(res => res.json())
        .then(data => {
          if (!data || !data[0] || !data[0].summary) {
            return null;
          }
          const s = data[0].summary;
          return {
            isbn,
            title: s.title || "",
            author: s.author || "",
            publisher: s.publisher || "",
            pubdate: s.pubdate || "",
            cover: s.cover || ""
          };
        });
    }

    function fetchFromGoogleBooks(isbn) {
      return fetch(
        `https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`
      )
        .then(res => res.json())
        .then(json => {
          if (!json.items || json.items.length === 0) {
            return null;
          }
          const info = json.items[0].volumeInfo;
          return {
            isbn,
            title: info.title || "",
            author: (info.authors || []).join(", "),
            publisher: info.publisher || "",
            pubdate: info.publishedDate || "",
            cover: info.imageLinks ? info.imageLinks.thumbnail : ""
          };
        });
    }

    function useBookData(data, source) {
      currentData = data;
      document.getElementById("title").textContent =
        `タイトル: ${data.title}（${source}）`;
      alert(`取得成功（${source}）`);

			const img = document.getElementById("cover");

  		if (data.cover) {
    		img.src = data.cover;
    		img.style.display = "block";
  		} else {
    		img.style.display = "none";
  		}
    }

    function fallbackManual(isbn) {
      currentData = { isbn, title: "" };
      document.getElementById("title").textContent =
        "タイトル: （手入力してください）";
      alert("書誌情報が見つかりませんでした");

			document.getElementById("cover").style.display = "none";
    }

function resetForNextBook() {
  // 内部データをクリア
  currentData = {};

  // 表示をクリア
  document.getElementById("isbn").textContent = "ISBN:";
  document.getElementById("title").textContent = "タイトル:";
  document.getElementById("cover").style.display = "none";

  // 手入力欄をクリア（ある場合）
  const isbn10Input = document.getElementById("isbn10Input");
  if (isbn10Input) isbn10Input.value = "";

  // ZXing を完全リセット
  if (codeReader) {
    codeReader.reset();
    codeReader = null;
  }
}



    // =========================
    // ZXing：カメラ起動
    // =========================
document.getElementById("start").onclick = async () => {
  // 念のためリセット
  if (codeReader) {
    codeReader.reset();
    codeReader = null;
  }

  // ★ 新しいインスタンス
  codeReader = new ZXing.BrowserBarcodeReader();

  try {
    const result = await codeReader.decodeOnceFromVideoDevice(
      null,
      "video"
    );

    const isbn13 = normalizeToISBN13(result.text);
    if (!isbn13) {
      alert("ISBNとして認識できません");
      return;
    }

    fetchBook(isbn13);

  } catch (err) {
    console.error(err);
    alert("バーコードを読み取れませんでした");
  } finally {
    if (codeReader) {
      codeReader.reset();
      codeReader = null;
    }
  }
};
    // =========================
    // 保存（Google Apps Script）
    // =========================
    document.getElementById("save").onclick = () => {
      if (!currentData.isbn) {
        alert("まだISBNを読み取っていません");
        return;
      }

      currentData.location =
        document.getElementById("location").value;

      fetch("https://script.google.com/macros/s/AKfycbyl_N6mUeEg-1eMh4S2K13EM3G7qXFtEco438XqIHhuuQzT9k45g13opAqUP7cCUA/exec", {
			  method: "POST",
  			body: JSON.stringify(currentData)
			})
			.then(res => res.text())
			.then(text => {
			  alert("保存結果: " + text);
				resetForNextBook();
			})
			.catch(err => {
  			console.error(err);
  			alert("保存に失敗しました");
			});
    };
  </script>
</body>
</html>
