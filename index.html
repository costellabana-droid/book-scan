<!doctype html>
<html>
<body>
<button onclick="test()">POST テスト</button>

<script>
function test() {
  fetch("ここに③の /exec URL", {
    method: "POST",
    body: "test"
  })
  .then(r => r.text())
  .then(t => alert("結果: " + t))
  .catch(e => alert("エラー"));
}
</script>
</body>
</html>
