<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>蔵書登録</title>

  <!-- ZXing ライブラリ -->
  <script src="https://unpkg.com/@zxing/library@0.20.0"></script>

  <style>
    body {
      font-family: sans-serif;
      padding: 10px;
    }
    video {
      border: 1px solid #ccc;
    }
    input, button {
      font-size: 16px;
      padding: 6px;
      margin-top: 8px;
      width: 100%;
    }
  </style>
</head>

<body>
  <h2>📚 蔵書登録</h2>

  <!-- ★ 必須：ユーザー操作用ボタン -->
  <button id="start">📷 スキャン開始</button>

  <br><br>

  <video id="video" width="300"></video>

  <p id="isbn">ISBN: </p>
  <p id="title">タイトル: </p>

  <input id="location" placeholder="保管場所（例：本棚A-2）" />

  <button id="save">💾 保存</button>

  <script>
    // =========================
    // 共通データ
    // =========================
    let currentData = {};
    let codeReader = null;

    // =========================
    // ISBN 正規化
    // =========================
    function normalizeISBN(text) {
      return text.replace(/[^0-9X]/gi, "").trim();
    }

    // =========================
    // OpenBD → Google Books
    // =========================
    function fetchBook(isbn) {
      fetchFromOpenBD(isbn)
        .then(data => {
          if (data) {
            useBookData(data, "OpenBD");
          } else {
            return fetchFromGoogleBooks(isbn);
          }
        })
        .then(data => {
          if (data) {
            useBookData(data, "Google Books");
          } else {
            fallbackManual(isbn);
          }
        })
        .catch(err => {
          console.error(err);
          fallbackManual(isbn);
        });
    }

    function fetchFromOpenBD(isbn) {
      return fetch(`https://api.openbd.jp/v1/get?isbn=${isbn}`)
        .then(res => res.json())
        .then(data => {
          if (!data || !data[0] || !data[0].summary) {
            return null;
          }
          const s = data[0].summary;
          return {
            isbn,
            title: s.title || "",
            author: s.author || "",
            publisher: s.publisher || "",
            pubdate: s.pubdate || "",
            cover: s.cover || ""
          };
        });
    }

    function fetchFromGoogleBooks(isbn) {
      return fetch(
        `https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`
      )
        .then(res => res.json())
        .then(json => {
          if (!json.items || json.items.length === 0) {
            return null;
          }
          const info = json.items[0].volumeInfo;
          return {
            isbn,
            title: info.title || "",
            author: (info.authors || []).join(", "),
            publisher: info.publisher || "",
            pubdate: info.publishedDate || "",
            cover: info.imageLinks ? info.imageLinks.thumbnail : ""
          };
        });
    }

    function useBookData(data, source) {
      currentData = data;
      document.getElementById("title").textContent =
        `タイトル: ${data.title}（${source}）`;
      alert(`取得成功（${source}）`);
    }

    function fallbackManual(isbn) {
      currentData = { isbn, title: "" };
      document.getElementById("title").textContent =
        "タイトル: （手入力してください）";
      alert("書誌情報が見つかりませんでした");
    }

    // =========================
    // ZXing：カメラ起動
    // =========================
    document.getElementById("start").onclick = () => {
      if (codeReader) {
        codeReader.reset();
      }

      codeReader = new ZXing.BrowserBarcodeReader();

      codeReader.decodeFromVideoDevice(
        null,
        'video',
        (result, err) => {
          if (result) {
            const raw = result.text;
            const isbn = normalizeISBN(raw);

            document.getElementById("isbn").textContent =
              "ISBN: " + isbn;

            fetchBook(isbn);

            // ★ 同じ本を連続で読まない
            codeReader.reset();
          }
        }
      );
    };

    // =========================
    // 保存（Google Apps Script）
    // =========================
    document.getElementById("save").onclick = () => {
      if (!currentData.isbn) {
        alert("まだISBNを読み取っていません");
        return;
      }

      currentData.location =
        document.getElementById("location").value;

      fetch("【ここに Apps Script の URL】", {
        method: "POST",
        body: JSON.stringify(currentData)
      })
      .then(res => res.json())
      .then(() => {
        alert("保存しました");
        document.getElementById("location").value = "";
      })
      .catch(err => {
        console.error(err);
        alert("保存に失敗しました");
      });
    };
  </script>
</body>
</html>
