<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>蔵書登録</title>

  <!-- ★ ZXing を正しく読み込む -->
  <script src="https://unpkg.com/@zxing/library@0.20.0"></script>
</head>

<body>
<h2>📚 蔵書登録</h2>

<button id="start">📷 スキャン開始</button>
<br><br>

<video id="video" width="300"></video>
<p id="isbn"></p>

<input id="location" placeholder="保管場所（例：本棚A-2）" />
<br><br>

<button onclick="save()">保存</button>

<script>
let currentData = {};
let codeReader;

document.getElementById("start").onclick = () => {
  codeReader = new ZXing.BrowserBarcodeReader();
  codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {
    if (result) {
      const isbn = result.text;
      document.getElementById('isbn').textContent = "ISBN: " + isbn;
      fetchBook(isbn);
      codeReader.reset();
    }
  });
};

function fetchBook(isbn) {
  fetch(`https://api.openbd.jp/v1/get?isbn=${isbn}`)
    .then(res => res.json())
    .then(data => {
      if (!data[0]) {
        alert("書誌情報が見つかりません");
        return;
      }
      const s = data[0].summary;
      currentData = {
        isbn: isbn,
        title: s.title,
        author: s.author,
        publisher: s.publisher,
        pubdate: s.pubdate,
        cover: s.cover
      };
      alert(`取得完了:\n${s.title}`);
    });
}

function save() {
  currentData.location =
    document.getElementById('location').value;

  fetch("【https://accounts.google.com/signin/oauth/v2/consentsummary?authuser=0&part=AJi8hAO44-7wJ86l8F2ho-AtY40Ib2l5nY9rX8hRTgAV-cUIDVBGuv-h6dH1qLG-DSbwdUXOdFUIYZvQ2l7f6TPwNpuwENU11UKyosLo7l8ouZMpjQ4KXjOYrKtTghxaQK-1BdC-qaRynCVpi18z_agEUTuHasH7PFZhUUAJCmi9WC-I_tvow0TpqfmJdyoL3WWjpKB2I6LufkaLr0ACc3x_doh5LCKNJ0IpmBRxVdkApORNSOfZzbBaD6dvdd21--icfNl5EwNAAo-bFocsKHaE_RrpMt0MJDucTv7h1TyMCydc7fUURfrGIRjrCW-bLIggbsuBUSPhomeihwMzTUfClhFbQkEyPSzCNkQRv85NKxtZrfbA1Ctx0EMnrRWh-hhvO6uMm7EBjH0YMFGBgT47hTXaEQZY48rFo0ETGo1_zXH3j-GTiJ4f-ylQSLrJv55_W_IWl0FFW2ZyuEJram7fii5siTVMlteDmW_LnwoBJyZDF3ck1Bme5XP_v_4QSlrTNSnIJ46768Q5hxLfIOz7j5FnloersUoHI8ZD9x-p0-TuBO5JjHZnptyqvi5FLWsY4i_z9Qd0we98m2VhnC1nYIJiCU_vXrHqfmg0v1jRrX7OQSwPCFoPMSwtUhEVCi3c_TIizaYrnK0EXHVtoPDTfmqKl1VVVqiWNAzO-aZhHYMss9fMXBoeqyTg_b2h6feHCyuTREPnE3MLLXAmifUTmWHM4sBDb534sIv-eLYRC4wNc8vyJ5s&flowName=GeneralOAuthFlow&hl=en&as=S873815215%3A1777536584255792&client_id=504834420833-76vb1950ftncffacbcbmo6sl5h1ae03v.apps.googleusercontent.com&rapt=AEjHL4PYffQ615jNU3evYgT1qX9ifTAxoZylO8wuiARv83McrTmrqSqv0lgVGjYq1Rx_-4UKwsvTPVhkOuT9uIezHMz5UXVDuHwP155aYpLHfv0treeJ_oU】", {

}
</script>
